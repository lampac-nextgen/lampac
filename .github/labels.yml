# Declarative label taxonomy. Synced by .github/workflows/sync-labels.yml
# Do not delete-other: keep delete-other-labels false in the workflow.

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "documentation"
