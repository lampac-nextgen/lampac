name: Labeler

# pull_request_target needed for fork PR labels (base GITHUB_TOKEN).
# After 2026-11-02 GitHub blocks PRT by default on public repos; allowed by
# Actions policy allow-labeler-pull-request-target (this workflow only).
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR by paths
    # pull_request_target + base token: never checkout PR head.
    if: github.repository == 'lampac-nextgen/lampac'
    runs-on: ubuntu-26.04
    steps:
      - name: Label
        uses: actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
          repo-token: ${{ secrets.GITHUB_TOKEN }}
