name: Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR by paths
    # pull_request_target + base token: never checkout PR head.
    if: github.repository == 'lampac-nextgen/lampac'
    runs-on: ubuntu-26.04
    steps:
      - name: Label
        uses: actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
          repo-token: ${{ secrets.GITHUB_TOKEN }}
