  // "rch": {
  //   "enable": true,
  //   "autoReconnect": false,
  //   "requiredConnected": 1
  // },
  "openstat": {
    "enable": true
  },
  "online": {
    "name": "Lampac NextGen",
    "spiderName": "Lampac NextGen",
    "version": true,
    "btn_priority_forced": true
  },
  "sisi": {
    "lgbt": false,
    "spider": false,
    "NextHUB": true,
    "history": {
      "enable": false
    }
  }
