contentParse:
  eval: |
    var canonical = System.Text.RegularExpressions.Regex.Match(
      html,
      "<link[^>]+rel=\"canonical\"[^>]+href=\"https?://[^/]+/(models/[^\"]+/)\"",
      System.Text.RegularExpressions.RegexOptions.IgnoreCase | System.Text.RegularExpressions.RegexOptions.Singleline
    );

    if (!canonical.Success)
    {
      canonical = System.Text.RegularExpressions.Regex.Match(
        html,
        "<link[^>]+href=\"https?://[^/]+/(models/[^\"]+/)\"[^>]+rel=\"canonical\"",
        System.Text.RegularExpressions.RegexOptions.IgnoreCase | System.Text.RegularExpressions.RegexOptions.Singleline
      );
    }

    string currentModelPath = canonical.Groups[1].Value?.Trim();

    if (pl.model == null)
    {
      try
      {
        string href = row.SelectSingleNode(".//a[contains(@class, 'card')]")?.GetAttributeValue("href", null)
          ?? row.SelectSingleNode(".//a")?.GetAttributeValue("href", null);

        if (!string.IsNullOrEmpty(href))
        {
          if (!href.StartsWith("http"))
            href = href.StartsWith("/") ? $"{init.host}{href}" : $"{init.host}/{href}";

          var cache = Shared.Services.Hybrid.HybridCache.GetMemory();
          string memKey = $"huyamba:model:v1:{href}";
          object cached;

          bool sameCurrentModel(ModelItem item)
          {
            if (item == null || string.IsNullOrEmpty(currentModelPath))
              return false;

            string uri = item.uri ?? string.Empty;
            string modelHref = Shared.Services.Utilities.AesTo.Decrypt(
              System.Text.RegularExpressions.Regex.Match(uri, "model=([^&]+)").Groups[1].Value
            ) ?? string.Empty;

            return modelHref.Trim('/').Equals(currentModelPath.Trim('/'), System.StringComparison.OrdinalIgnoreCase);
          }

          if (cache.TryGetValue(memKey, out cached) && cached is ModelItem modelItem)
          {
            if (!sameCurrentModel(modelItem))
              pl.model = modelItem;
          }
          else
          {
            pl.myarg = $"model_probe:nexthub/model?plugin={Shared.Services.Utilities.AesTo.Encrypt(plugin)}&href={Shared.Services.Utilities.AesTo.Encrypt(href)}";

            if (!string.IsNullOrEmpty(currentModelPath))
              pl.myarg += $"&current={Shared.Services.Utilities.AesTo.Encrypt(currentModelPath)}";
          }
        }
      }
      catch { }
    }

    return pl;
  nodes: //div[contains(@class, 'item thumb')]
  name:
    node: .//div[@class='title']
  href:
    node: .//a
    attribute: href
  img:
    node: .//img
    attribute: data-webp
  duration:
    node: .//div[@class='box']
  preview:
    node: .//img
    attribute: data-preview

