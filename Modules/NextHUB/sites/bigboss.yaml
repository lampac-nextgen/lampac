  format: "{host}/{(page > 1 ? model.TrimEnd('/') + $\"/page-{page}.html\" : model)}"
  total_pages: 777

contentParse:
  eval: |
    string currentHeading = Regex.Match(
      html,
      "<div class=\"main__title[^\"]*\">.*?<h2>([^<]+)</h2>",
      RegexOptions.IgnoreCase | RegexOptions.Singleline
    ).Groups[1].Value?.Trim();

    if (pl.model == null)
    {
      try
      {
        string href = row.SelectSingleNode(".//a[contains(@class,'video-unit')]")?.GetAttributeValue("href", null)
          ?? row.SelectSingleNode(".//a")?.GetAttributeValue("href", null);

        if (!string.IsNullOrEmpty(href))
        {
          if (!href.StartsWith("http"))
            href = href.StartsWith("/") ? $"{init.host}{href}" : $"{init.host}/{href}";

          var cache = Shared.Services.Hybrid.HybridCache.GetMemory();
          string memKey = $"bigboss:model:v1:{href}";
          object cached;

          if (cache.TryGetValue(memKey, out cached) && cached is ModelItem modelItem)
          {
            if (!string.Equals(currentHeading, modelItem.name, StringComparison.OrdinalIgnoreCase))
              pl.model = modelItem;
          }
          else
          {
            pl.myarg = $"model_probe:nexthub/model?plugin={Shared.Services.Utilities.AesTo.Encrypt(plugin)}&href={Shared.Services.Utilities.AesTo.Encrypt(href)}";

            if (!string.IsNullOrEmpty(currentHeading))
              pl.myarg += $"&current={Shared.Services.Utilities.AesTo.Encrypt(currentHeading)}";
          }
        }
      }
      catch { }
    }

    return pl;
  nodes: //div[contains(@class,'main__ct-items')]//div[contains(@class,'main__ct-item')]
  name:
    node: .//div[contains(@class,'video-unit__caption')]
  href:
    node: .//a[contains(@class,'video-unit')]
    attribute: href
  img:
    node: .//img
    attributes: ["data-src", "src"]

view:
