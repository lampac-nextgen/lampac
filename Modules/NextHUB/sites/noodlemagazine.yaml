enable: true
displayindex: 210
displayname: NoodleMagazine
host: https://hot.noodlemagazine.com
#client_type: web,apk,cors
#rch_access: web,apk,cors
#stream_access: web,apk,cors
qualitys_proxy: true
streamproxy_preview: true
geostreamproxy: ["ALL"]

menu:
  sort:
    Новинки: ""
    Популярное: popular/week?p={page}

list:
  uri: home?p={page}

search:
  uri: video/{search}?p={page}

contentParse:
  nodes: //div[contains(@class, 'item')]
  name:
    node: .//div[@class='title']
  href:
    node: .//a
    attribute: href
  img:
    node: .//img
    attribute: data-src
  duration:
    node: .//div[@class='m_time']
  quality:
    node: .//i[@class='hd_mark']
  preview:
    node: .//div
    attribute: data-trailer_url

view:
  related: true
  viewsource: true
  regexMatch:
    pattern: '"file":"([^"]+)"'
