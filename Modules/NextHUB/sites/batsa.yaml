contentParse:
  eval: |
    string currentHeading = Regex.Match(
      html,
      "<div class=\"heading\">\\s*<h1>([^<]+)</h1>",
      RegexOptions.IgnoreCase | RegexOptions.Singleline
    ).Groups[1].Value?.Trim();

    if (pl.model == null)
    {
      try
      {
        string href = row.SelectSingleNode(".//a[1]")?.GetAttributeValue("href", null);
        if (!string.IsNullOrEmpty(href))
        {
          if (!href.StartsWith("http"))
            href = href.StartsWith("/") ? $"{init.host}{href}" : $"{init.host}/{href}";

          var cache = Shared.Services.Hybrid.HybridCache.GetMemory();
          string memKey = $"batsa:model:v1:{href}";
          object cached;

          if (cache.TryGetValue(memKey, out cached) && cached is ModelItem modelItem)
          {
            pl.model = modelItem;
          }
          else
          {
            pl.myarg = $"model_probe:nexthub/model?plugin={Shared.Services.Utilities.AesTo.Encrypt(plugin)}&href={Shared.Services.Utilities.AesTo.Encrypt(href)}";

            if (!string.IsNullOrEmpty(currentHeading))
              pl.myarg += $"&current={Shared.Services.Utilities.AesTo.Encrypt(currentHeading)}";
          }
        }
      }
      catch { }
    }

    if (pl.model != null && !string.IsNullOrEmpty(currentHeading) && string.Equals(pl.model.name, currentHeading, StringComparison.OrdinalIgnoreCase))
      pl.model = null;

    return pl;
  nodes: //div[@class='grid-item aspect-ratio-16x9']
  name:
    node: .//div[@class='grid-item-description']//a
  href:
    node: .//a[1]
    attribute: href
  img:
    node: .//img
    attribute: src
  duration:
    node: .//span[contains(@class,'grid-item-dur')]
  quality:
    node: .//span[contains(@class,'grid-item-dur')]
  preview:
    node: .//video//source
    attribute: src

view:
