contentParse:
  eval: |
    string FormatDuration(long seconds)
    {
      if (seconds <= 0) return null;
      var ts = TimeSpan.FromSeconds(seconds);
      return ts.TotalHours >= 1 ? ts.ToString(@"h\:mm\:ss") : ts.ToString(@"m\:ss");
    }

    var jd = System.Text.Json.JsonDocument.Parse(html);
    if (jd.RootElement.ValueKind != System.Text.Json.JsonValueKind.Array)
      return playlists;

    foreach (var item in jd.RootElement.EnumerateArray())
    {
      if (!item.TryGetProperty("file", out var file) || file.ValueKind != System.Text.Json.JsonValueKind.Object)
        continue;

      string name = null;
      if (file.TryGetProperty("data", out var data) && data.ValueKind == System.Text.Json.JsonValueKind.Array && data.GetArrayLength() > 0)
      {
        var first = data[0];
        if (first.ValueKind == System.Text.Json.JsonValueKind.Object && first.TryGetProperty("cd_value", out var cdValue))
          name = cdValue.GetString();
      }

      if (string.IsNullOrWhiteSpace(name))
        continue;

      string multi = null;
      if (file.TryGetProperty("hls_resources", out var hls) && hls.ValueKind == System.Text.Json.JsonValueKind.Object && hls.TryGetProperty("fl_cdn_multi", out var flMulti))
        multi = flMulti.GetString();

      if (string.IsNullOrWhiteSpace(multi))
        continue;

      long fileId = 0;
      if (file.TryGetProperty("id", out var fileIdNode) && fileIdNode.ValueKind == System.Text.Json.JsonValueKind.Number)
        fileId = fileIdNode.GetInt64();

      if (fileId <= 0)
        continue;

      long durationSec = 0;
      if (file.TryGetProperty("fl_duration", out var durNode) && durNode.ValueKind == System.Text.Json.JsonValueKind.Number)
        durationSec = durNode.GetInt64();

      string quality = null;
      if (file.TryGetProperty("fl_height", out var hNode) && hNode.ValueKind == System.Text.Json.JsonValueKind.Number)
        quality = $"{hNode.GetInt32()}p";

      long thumbOffset = 0;
      if (item.TryGetProperty("fc_facts", out var facts) && facts.ValueKind == System.Text.Json.JsonValueKind.Array && facts.GetArrayLength() > 0)
      {
        var fact = facts[0];
        if (fact.ValueKind == System.Text.Json.JsonValueKind.Object && fact.TryGetProperty("fc_thumbs", out var thumbs) && thumbs.ValueKind == System.Text.Json.JsonValueKind.Array && thumbs.GetArrayLength() > 0)
        {
          var thumbNode = thumbs[0];
          if (thumbNode.ValueKind == System.Text.Json.JsonValueKind.Number)
            thumbOffset = thumbNode.GetInt64();
        }
      }

      string personName = null;
      string personSlug = null;
      string ownerName = null;
      string ownerSlug = null;
      if (item.TryGetProperty("tags", out var tags) && tags.ValueKind == System.Text.Json.JsonValueKind.Array)
      {
        foreach (var tag in tags.EnumerateArray())
        {
          string tagName = tag.TryGetProperty("tg_name", out var tgName) ? tgName.GetString() : null;
          string tagSlug = tag.TryGetProperty("tg_slug", out var tgSlug) ? tgSlug.GetString() : null;

          if (string.IsNullOrWhiteSpace(tagName) || string.IsNullOrWhiteSpace(tagSlug))
            continue;

          if (personName == null && tag.TryGetProperty("is_person", out var isPerson) && isPerson.ValueKind == System.Text.Json.JsonValueKind.True)
          {
            personName = tagName;
            personSlug = tagSlug;
          }

          if (ownerName == null && tag.TryGetProperty("is_owner", out var isOwner) && isOwner.ValueKind == System.Text.Json.JsonValueKind.True)
          {
            ownerName = tagName;
            ownerSlug = tagSlug;
          }
        }
      }

      string modelName = personName ?? ownerName;
      string modelSlug = personSlug ?? ownerSlug;
      ModelItem modelItem = null;
      if (!string.IsNullOrWhiteSpace(modelName) && !string.IsNullOrWhiteSpace(modelSlug))
      {
        modelItem = new ModelItem()
        {
          name = modelName,
          uri = $"nexthub?plugin={AesTo.Encrypt(plugin)}&cat={AesTo.Encrypt(modelSlug)}"
        };
      }

      string href = $"{init.host}/-0{fileId}";
      string picture = $"https://thumbs.externulls.com/videos/{fileId}/{thumbOffset}.webp?size=480x270";
      string stream = $"nexthub/vidosik?uri={AesTo.Encrypt($"{plugin}_-:-_{href}")}";

      playlists.Add(new PlaylistItem()
      {
        name = name,
        video = stream,
        picture = picture,
        time = FormatDuration(durationSec),
        quality = quality,
        json = true,
        related = false,
        model = modelItem,
        bookmark = new Bookmark()
        {
          site = "nexthub",
          href = $"{plugin}_-:-_{href}",
          image = picture
        }
      });
    }

    return playlists;
