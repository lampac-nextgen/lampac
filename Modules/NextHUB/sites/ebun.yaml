model:
  format: "{host}/{(page > 1 ? model.TrimEnd('/') + $\"/{page}/\" : model)}"
  total_pages: 777

contentParse:
  eval: |
    string currentHeading = System.Text.RegularExpressions.Regex.Match(
      html,
      "<h1[^>]+class=\"model__title\"[^>]*>([^<]+)</h1>",
      System.Text.RegularExpressions.RegexOptions.IgnoreCase | System.Text.RegularExpressions.RegexOptions.Singleline
    ).Groups[1].Value?.Trim();

    if (pl.model == null)
    {
      try
      {
        string href = row.SelectSingleNode(".//a")?.GetAttributeValue("href", null);

        if (!string.IsNullOrEmpty(href))
        {
          if (!href.StartsWith("http"))
            href = href.StartsWith("/") ? $"{init.host}{href}" : $"{init.host}/{href}";

          var cache = Shared.Services.Hybrid.HybridCache.GetMemory();
          string memKey = $"ebun:model:v2:{href}";
          object cached;

          if (cache.TryGetValue(memKey, out cached) && cached is ModelItem modelItem)
          {
            if (string.IsNullOrEmpty(currentHeading) || currentHeading.IndexOf(modelItem.name, System.StringComparison.OrdinalIgnoreCase) < 0)
              pl.model = modelItem;
          }
          else
          {
            pl.myarg = $"model_probe:nexthub/model?plugin={Shared.Services.Utilities.AesTo.Encrypt(plugin)}&href={Shared.Services.Utilities.AesTo.Encrypt(href)}";

            if (!string.IsNullOrEmpty(currentHeading))
              pl.myarg += $"&current={Shared.Services.Utilities.AesTo.Encrypt(currentHeading)}";
          }
        }
      }
      catch { }
    }

    return pl;
  nodes: //div[contains(@class, 'item th-item item_new')]
  name:
    node: .//div[@class='item-title']
  href:
    node: .//a
    attribute: href
  img:
    node: .//img
    attribute: data-src
  duration:
    node: .//div[@class='meta-time']

view:
  viewsource: true
  iframe:
    pattern: '<iframe[^>]+ src="([^"]+)"'
  regexMatch:
    matches: ["video_alt_url", "video_url"]
    pattern: "{value}:[\t ]+'([^']+)'"
