    string currentModelSlug = System.Text.RegularExpressions.Regex.Match(
      html,
      "<link[^>]+rel=\"canonical\"[^>]+href=\"https?://[^/]+/model/([^\"/]+)/\"",
      System.Text.RegularExpressions.RegexOptions.IgnoreCase | System.Text.RegularExpressions.RegexOptions.Singleline
    ).Groups[1].Value?.Trim();

