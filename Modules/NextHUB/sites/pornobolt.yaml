list:
  uri: "{page}/"

search:
  uri: search/{search}/{page}

model:
  format: "{host}/{model.TrimEnd('/')}?page={page}"
  total_pages: 777

contentParse:
  eval: |
    string currentModelPath = System.Text.RegularExpressions.Regex.Match(
      html,
      "<link[^>]+rel=\"canonical\"[^>]+href=\"https?://[^/]+/(models/[^\"?#/]+)\"",
      System.Text.RegularExpressions.RegexOptions.IgnoreCase | System.Text.RegularExpressions.RegexOptions.Singleline
    ).Groups[1].Value?.Trim();

    if (pl.model == null)
    {
      try
      {
        string href = row.SelectSingleNode(".//a")?.GetAttributeValue("href", null);
        if (!string.IsNullOrEmpty(href))
        {
          if (!href.StartsWith("http"))
            href = href.StartsWith("/") ? $"{init.host}{href}" : $"{init.host}/{href}";

          pl.myarg = $"model_probe:nexthub/model?plugin={Shared.Services.Utilities.AesTo.Encrypt(plugin)}&href={Shared.Services.Utilities.AesTo.Encrypt(href)}";

          if (!string.IsNullOrEmpty(currentModelPath))
            pl.myarg += $"&current={Shared.Services.Utilities.AesTo.Encrypt(currentModelPath)}";
        }
      }
      catch { }
    }

    return pl;
  nodes: //div[@class='media-obj widethumb']
  name:
    node: .//p
  href:
    node: .//a
    attribute: href
  img:
    node: .//img
    attributes: ["data-original", "src"]
  duration:
    node: .//span[@itemprop='duration']
  preview:
    node: .//img
    attribute: data-video

view:
  related: true
  viewsource: true
  nodeFile:
    node: //meta[@property='ya:ovs:content_url']
    attribute: content
